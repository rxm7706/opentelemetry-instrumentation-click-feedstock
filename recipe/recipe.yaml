# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.64b0"

package:
  name: opentelemetry-instrumentation-click
  version: ${{ version }}

source:
  url: 
    https://pypi.org/packages/source/o/opentelemetry-instrumentation-click/opentelemetry_instrumentation_click-${{
    version }}.tar.gz
  sha256: e819f7caa98c79177a4977a7ad30cdcbc86b62475e285aadf47fef08dd88ac1f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - opentelemetry-semantic-conventions ==${{ version }}
    - wrapt >=1.0.0,<3.0.0
    - click >=8.1.3,<9.0.0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation.click
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: 
    https://github.com/open-telemetry/opentelemetry-python-contrib/tree/v0.64b0/instrumentation/opentelemetry-instrumentation-click
  license: Apache-2.0
  license_file: LICENSE
  summary: Click instrumentation for OpenTelemetry
  description: |
    Click instrumentation for OpenTelemetry
  repository: https://github.com/open-telemetry/opentelemetry-python-contrib

extra:
  recipe-maintainers:
    - pb01ka
    - rxm7706
    - conda-forge/opentelemetry-api
